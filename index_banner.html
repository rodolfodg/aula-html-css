<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio: Ticket da Sprint</title>
    <style>
   
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f0f0;
        }

        /* 1. Estrutura div.banner-promocional (relative) */
        .banner-promocional {
            position: relative;
            width: 90%;
            max-width: 800px;
            border-radius: 15px;
            overflow: hidden; /* Garante que a imagem não saia da borda arredondada */
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        /* 2. Imagem base */
        .imagem-base {
            width: 100%;
            height: 450px;
            object-fit: cover;
            display: block;
        }

        /* 3. Div absoluta centralizada */
        .conteudo-central {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%); /* Técnica para centralizar perfeitamente */
            
            /* 5. Uso de RGBA para contraste */
            background-color: rgba(0, 0, 0, 0.7); 
            color: white;
            padding: 40px;
            text-align: center;
            border-radius: 12px;
            width: 70%;
        }

        .conteudo-central h1 {
            margin: 0;
            font-size: 2.5rem;
            text-transform: uppercase;
        }

        .conteudo-central p {
            font-size: 1.2rem;
            margin: 10px 0 25px;
        }

        /* 4. Botão Comprar Agora */
        .btn-comprar {
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1rem;
            font-weight: bold;
            text-transform: uppercase;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .btn-comprar:hover {
            background-color: #27ae60;
        }
    </style>
</head>
<body>

    <div class="banner-promocional">
        <img src="curso.jpg" alt="Banner Educacional" class="imagem-base">
        
        <div class="conteudo-central">
            <h1>Oferta Especial</h1>
            <p>30% OFF nos cursos</p>
            <button class="btn-comprar">Comprar Agora</button>
        </div>
    </div>

</body>
</html>
